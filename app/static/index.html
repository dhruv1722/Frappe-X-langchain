<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frappe Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #212121;
      color: #ececec;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 58px;
      border-bottom: 1px solid #383838;
      display: flex;
      align-items: center;
      padding: 0 22px;
      font-weight: 600;
    }

    #messages {
      width: min(820px, 100%);
      margin: 0 auto;
      padding: 28px 20px 140px;
      flex: 1;
    }

    .message {
      white-space: pre-wrap;
      line-height: 1.55;
      padding: 16px 18px;
      margin-bottom: 18px;
      border-radius: 12px;
    }

    .user {
      background: #303030;
      margin-left: 10%;
    }

    .assistant {
      background: #252525;
      border: 1px solid #383838;
      margin-right: 10%;
    }

    #composer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 18px;
      background: linear-gradient(transparent, #212121 30%);
    }

    form {
      width: min(820px, 100%);
      margin: 0 auto;
      display: flex;
      gap: 10px;
      padding: 10px;
      background: #303030;
      border: 1px solid #484848;
      border-radius: 16px;
    }

    textarea {
      resize: none;
      flex: 1;
      min-height: 28px;
      max-height: 180px;
      border: 0;
      outline: 0;
      color: inherit;
      background: transparent;
      font: inherit;
      line-height: 1.5;
    }

    button {
      align-self: end;
      border: 0;
      border-radius: 10px;
      padding: 9px 14px;
      background: #fff;
      color: #111;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }
  </style>
</head>

<body>
  <header>Frappe Assistant</header>

  <main id="messages">
    <div class="message assistant">
      Hello. I can help with approved Frappe and ERPNext tasks.
    </div>
  </main>

  <div id="composer">
    <form id="chat-form">
      <textarea id="message" aria-label="Message" placeholder="Message Frappe Assistant" rows="1"></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script>
    const userIdKey = "frappe-assistant-user-id";
    const conversationIdKey = "frappe-assistant-conversation-id";

    const userId = localStorage.getItem(userIdKey)
      || crypto.randomUUID();

    localStorage.setItem(userIdKey, userId);

    const messages = document.getElementById("messages");
    const form = document.getElementById("chat-form");
    const textarea = document.getElementById("message");
    const sendButton = document.getElementById("send");

    function appendMessage(role, text) {
      const item = document.createElement("div");
      item.className = `message ${role}`;
      item.textContent = text;
      messages.appendChild(item);
      item.scrollIntoView({ behavior: "smooth", block: "end" });
      return item;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = textarea.value.trim();
      if (!message) return;

      appendMessage("user", message);
      textarea.value = "";
      textarea.focus();
      sendButton.disabled = true;

      const pending = appendMessage("assistant", "Thinking…");

      try {
        const response = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message,
            user_id: userId,
            conversation_id: localStorage.getItem(conversationIdKey),
          }),
        });

        if (!response.ok) {
          throw new Error("Request failed");
        }

        const result = await response.json();
        localStorage.setItem(conversationIdKey, result.conversation_id);
        pending.textContent = result.answer || "I could not generate a response.";
      } catch (error) {
        console.error("Ask request failed:", error);
        pending.textContent =
          "The assistant could not complete this request. Please try again.";
      } finally {
        sendButton.disabled = false;
      }
    });
  </script>
</body>

</html>
