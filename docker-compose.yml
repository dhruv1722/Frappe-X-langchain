services:
  langchain-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: langchain-local
    container_name: langchain-ai

    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SALES_MCP_ENABLED: ${SALES_MCP_ENABLED:-false}
      ERP_MCP_URL: ${ERP_MCP_URL:-}
      ERP_MCP_SHARED_SECRET: ${ERP_MCP_SHARED_SECRET:-}
      FRAPPE_MCP_URL: ${FRAPPE_MCP_URL:-}
      FRAPPE_MCP_SHARED_SECRET: ${FRAPPE_MCP_SHARED_SECRET:-}

    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
